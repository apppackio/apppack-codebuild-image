---
name: Build

on: [push, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # go-version-file reads the `golang` line out of .tool-versions, so the
      # toolchain lives in exactly one place. Needs setup-go >= v6.1.0, which
      # is where .tool-versions support landed (actions/setup-go#673).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tool-versions
      # Catches go.mod/go.sum drifting out of step with the imports. Renovate
      # bumps a version in go.mod but cannot rewrite a Go import path, so a
      # major update lands as a require that nothing imports: that is how #73
      # merged green with both s3sync/v2 and an unused s3sync/v3, and only
      # broke one PR later in #74. `-diff` reports and exits non-zero without
      # writing, so the job fails instead of quietly fixing it.
      #
      # This replaces a `go get -t -v ./...` step that used to run here. `go
      # test` resolves and downloads what it needs from the committed go.mod,
      # so that step fetched nothing extra -- but it can rewrite go.mod and
      # go.sum, which would have masked exactly the drift checked for here.
      - name: Check go.mod is tidy
        run: go mod tidy -diff
        working-directory: ./builder
      - name: Test
        run: go test -coverprofile=coverage.out ./...
        working-directory: ./builder
      - name: Coverage
        run: go tool cover -func=coverage.out
        working-directory: ./builder
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # go-version-file reads the `golang` line out of .tool-versions, so the
      # toolchain lives in exactly one place. Needs setup-go >= v6.1.0, which
      # is where .tool-versions support landed (actions/setup-go#673).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tool-versions
      # One golangci-lint run covers both linting and formatting: run also
      # reports the formatters a config enables explicitly, and .golangci.toml
      # enables gofumpt and gci.
      #
      # The action joins version-file onto working-directory, so this needs the
      # ../ to reach the repo root: the Go module is in builder/ but the pin
      # and the lint config are not.
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version-file: ../.tool-versions
          working-directory: builder
  build-image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        id: build
        run: |
          set -ex
          IMAGE=ghcr.io/${{ github.repository }}/builder:${{ github.run_id }}
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  integration:
    name: integration (heroku-${{ matrix.stack }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: ["22", "24", "26"]
    needs:
      - test
      - build-image
    permissions:
      id-token: write
      contents: read
      packages: read
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull image
        run: docker pull ${{ needs.build-image.outputs.image }}
      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::891426818781:role/github-actions-integration-tests
          aws-region: us-east-1
      - name: Checkout sample repo
        run: git clone https://github.com/apppackio/apppack-demo-python.git
      # The demo's apppack.toml pins builder = "heroku/builder:22". Rewrite it
      # so one checkout of main covers every stack, instead of a demo branch per builder.
      - name: Set builder for stack
        working-directory: ./apppack-demo-python
        run: |
          set -ex
          sed -i 's|^builder = .*|builder = "heroku/builder:${{ matrix.stack }}"|' apppack.toml
          grep -x 'builder = "heroku/builder:${{ matrix.stack }}"' apppack.toml
      - name: Run integration tests
        working-directory: ./apppack-demo-python
        run: |
          cat <<EOF > .envfile
          APPNAME=gh-integration
          CODEBUILD_BUILD_ID=demo-python:${{ github.run_id }}
          CODEBUILD_SOURCE_VERSION=${{ github.sha }}
          DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_ACCESS_TOKEN=${{ secrets.DOCKERHUB_ACCESS_TOKEN }}
          DOCKER_REPO=891426818781.dkr.ecr.us-east-1.amazonaws.com/github-integration-test
          ARTIFACT_BUCKET=integration-test-buildartifacts
          AWS_REGION
          AWS_ACCESS_KEY_ID
          AWS_SECRET_ACCESS_KEY
          AWS_SESSION_TOKEN
          EOF

          docker run \
            --rm \
            --privileged \
            --env-file .envfile \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$(pwd):/app" \
            --workdir /app \
            ${{ needs.build-image.outputs.image }} \
            /bin/sh -c "set -x; git config --global --add safe.directory /app && apppack-builder prebuild; apppack-builder build; apppack-builder postbuild"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15.0"
      - name: Verify apppack.toml
        working-directory: ./apppack-demo-python
        run: |
          set -ex
          cat apppack.toml
          test "$(python -c 'import tomllib; print(tomllib.load(open("apppack.toml", "rb"))["services"]["web"]["command"])')" = "bash -c 'gunicorn --access-logfile - --bind 0.0.0.0:\$PORT --forwarded-allow-ips '\"'\"'*'\"'\"' app:app'"

  integration-appjson:
    runs-on: ubuntu-latest
    needs:
      - test
      - build-image
    permissions:
      id-token: write
      contents: read
      packages: read
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull image
        run: docker pull ${{ needs.build-image.outputs.image }}
      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::891426818781:role/github-actions-integration-tests
          aws-region: us-east-1
      - name: Checkout sample repo
        run: git clone --branch app.json https://github.com/apppackio/apppack-demo-python.git
      - name: Run integration tests
        working-directory: ./apppack-demo-python
        run: |
          cat <<EOF > .envfile
          APPNAME=gh-integration
          CODEBUILD_BUILD_ID=demo-python:${{ github.run_id }}
          CODEBUILD_SOURCE_VERSION=${{ github.sha }}
          DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_ACCESS_TOKEN=${{ secrets.DOCKERHUB_ACCESS_TOKEN }}
          DOCKER_REPO=891426818781.dkr.ecr.us-east-1.amazonaws.com/github-integration-test
          ARTIFACT_BUCKET=integration-test-buildartifacts
          AWS_REGION
          AWS_ACCESS_KEY_ID
          AWS_SECRET_ACCESS_KEY
          AWS_SESSION_TOKEN
          EOF

          docker run \
            --rm \
            --privileged \
            --env-file .envfile \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$(pwd):/app" \
            --workdir /app \
            ${{ needs.build-image.outputs.image }} \
            /bin/sh -c "set -x; git config --global --add safe.directory /app && apppack-builder prebuild; apppack-builder build; apppack-builder postbuild"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15.0"
      - name: Verify apppack.toml
        working-directory: ./apppack-demo-python
        run: |
          set -ex
          cat apppack.toml
          test "$(python -c 'import tomllib; print(tomllib.load(open("apppack.toml", "rb"))["services"]["web"]["command"])')" = "bash -c 'gunicorn --access-logfile - --bind 0.0.0.0:\$PORT --forwarded-allow-ips '\"'\"'*'\"'\"' app:app'"

  integration-docker:
    runs-on: ubuntu-latest
    needs:
      - test
      - build-image
    permissions:
      id-token: write
      contents: read
      packages: read
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull image
        run: docker pull ${{ needs.build-image.outputs.image }}
      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::891426818781:role/github-actions-integration-tests
          aws-region: us-east-1
      - name: Checkout sample repo (docker-build branch)
        run: git clone --branch docker-build https://github.com/apppackio/apppack-demo-python.git
      - name: Run integration tests
        working-directory: ./apppack-demo-python
        run: |
          cat <<EOF > .envfile
          APPNAME=gh-docker-integration
          CODEBUILD_BUILD_ID=demo-python:${{ github.run_id }}
          CODEBUILD_SOURCE_VERSION=${{ github.sha }}
          DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_ACCESS_TOKEN=${{ secrets.DOCKERHUB_ACCESS_TOKEN }}
          DOCKER_REPO=891426818781.dkr.ecr.us-east-1.amazonaws.com/github-integration-test
          ARTIFACT_BUCKET=integration-test-buildartifacts
          AWS_REGION
          AWS_ACCESS_KEY_ID
          AWS_SECRET_ACCESS_KEY
          AWS_SESSION_TOKEN
          EOF

          docker run \
            --rm \
            --privileged \
            --env-file .envfile \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$(pwd):/app" \
            --workdir /app \
            ${{ needs.build-image.outputs.image }} \
            /bin/sh -c "set -x; git config --global --add safe.directory /app && apppack-builder prebuild; apppack-builder build; apppack-builder postbuild"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15.0"
      - name: Verify apppack.toml
        working-directory: ./apppack-demo-python
        run: |
          set -ex
          cat apppack.toml
          test "$(python -c 'import tomllib; print(tomllib.load(open("apppack.toml", "rb"))["services"]["web"]["command"])')" = 'gunicorn --access-logfile - --bind 0.0.0.0:$PORT --forwarded-allow-ips '"'"'*'"' app:app"
  # Aggregate check so branch protection can require one context instead of a
  # list that drifts every time a job is added or renamed. always() is load
  # bearing: without it this job is skipped when a dependency fails, and a
  # skipped required check does not block a merge.
  gate:
    name: CI
    runs-on: ubuntu-latest
    if: always()
    needs:
      - test
      - lint
      - build-image
      - integration
      - integration-docker
      - integration-appjson
    steps:
      - name: Verify every job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e 'any(.[]; .result != "success")' >/dev/null; then
            echo "::error::one or more required jobs did not succeed"
            exit 1
          fi
  deploy:
    runs-on: ubuntu-latest
    # Only run this job if the current commit is tagged with a version
    if: startswith(github.ref, 'refs/tags/v')
    needs:
      - gate
    permissions:
      id-token: write
      contents: read
      packages: read
    env:
      ECR_REPO: public.ecr.aws/d9q4v8a4/apppack-build
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull and tag image
        run: |
          set -ex
          docker pull ${{ needs.build-image.outputs.image }}
          docker tag ${{ needs.build-image.outputs.image }} "$ECR_REPO:builder"
          docker tag ${{ needs.build-image.outputs.image }} "$ECR_REPO:${{ github.ref_name }}"
      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: "arn:aws:iam::101287669015:role/codebuild-image-github-actions"
          aws-region: us-east-1
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          registry-type: public
      - name: Push image
        run: |
          set -ex
          docker push "$ECR_REPO:builder"
          docker push "$ECR_REPO:${{ github.ref_name }}"
