---
name: Build

on: [push, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # go-version-file reads the `golang` line out of .tool-versions, so the
      # toolchain lives in exactly one place. Needs setup-go >= v6.1.0, which
      # is where .tool-versions support landed (actions/setup-go#673).
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: .tool-versions
      # Catches go.mod/go.sum drifting out of step with the imports. Renovate
      # bumps a version in go.mod but cannot rewrite a Go import path, so a
      # major update lands as a require that nothing imports: that is how #73
      # merged green with both s3sync/v2 and an unused s3sync/v3, and only
      # broke one PR later in #74. `-diff` reports and exits non-zero without
      # writing, so the job fails instead of quietly fixing it.
      #
      # This replaces a `go get -t -v ./...` step that used to run here. `go
      # test` resolves and downloads what it needs from the committed go.mod,
      # so that step fetched nothing extra -- but it can rewrite go.mod and
      # go.sum, which would have masked exactly the drift checked for here.
      - name: Check go.mod is tidy
        run: go mod tidy -diff
        working-directory: ./builder
      - name: Test
        run: go test -coverprofile=coverage.out ./...
        working-directory: ./builder
      - name: Coverage
        run: go tool cover -func=coverage.out
        working-directory: ./builder
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # go-version-file reads the `golang` line out of .tool-versions, so the
      # toolchain lives in exactly one place. Needs setup-go >= v6.1.0, which
      # is where .tool-versions support landed (actions/setup-go#673).
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: .tool-versions
      # One golangci-lint run covers both linting and formatting: run also
      # reports the formatters a config enables explicitly, and .golangci.toml
      # enables gofumpt and gci.
      #
      # The action joins version-file onto working-directory, so this needs the
      # ../ to reach the repo root: the Go module is in builder/ but the pin
      # and the lint config are not.
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version-file: ../.tool-versions
          working-directory: builder
  build-image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        id: build
        run: |
          set -ex
          IMAGE=ghcr.io/${{ github.repository }}/builder:${{ github.run_id }}
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  # Exercises the demo app's default branch: apppack.toml, buildpack build.
  integration:
    runs-on: ubuntu-latest
    needs:
      - test
      - build-image
    permissions:
      id-token: write
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull image
        run: docker pull ${{ needs.build-image.outputs.image }}
      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::891426818781:role/github-actions-integration-tests
          aws-region: us-east-1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
      - name: Run integration test
        env:
          IMAGE: ${{ needs.build-image.outputs.image }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          DOCKER_REPO: 891426818781.dkr.ecr.us-east-1.amazonaws.com/github-integration-test
          ARTIFACT_BUCKET: integration-test-buildartifacts
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_ACCESS_TOKEN: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}
          APPNAME: gh-integration
          # A folded scalar, so the quoting in the expected command
          # survives verbatim without shell escaping.
          EXPECTED_COMMAND: >-
            bash -c 'gunicorn --access-logfile - --bind 0.0.0.0:$PORT --forwarded-allow-ips '"'"'*'"'"' app:app'
        run: .github/scripts/integration-test.sh

  # Exercises the heroku-24 builder, selected via apppack.toml build.builder.
  integration-heroku24:
    runs-on: ubuntu-latest
    needs:
      - test
      - build-image
    permissions:
      id-token: write
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull image
        run: docker pull ${{ needs.build-image.outputs.image }}
      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::891426818781:role/github-actions-integration-tests
          aws-region: us-east-1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
      - name: Run integration test
        env:
          IMAGE: ${{ needs.build-image.outputs.image }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          DOCKER_REPO: 891426818781.dkr.ecr.us-east-1.amazonaws.com/github-integration-test
          ARTIFACT_BUCKET: integration-test-buildartifacts
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_ACCESS_TOKEN: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}
          APPNAME: gh-integration
          BRANCH: buildpacks-24
          # A folded scalar, so the quoting in the expected command
          # survives verbatim without shell escaping.
          EXPECTED_COMMAND: >-
            bash -c 'gunicorn --access-logfile - --bind 0.0.0.0:$PORT --forwarded-allow-ips '"'"'*'"'"' app:app'
        run: .github/scripts/integration-test.sh

  # Exercises configuration from app.json rather than apppack.toml.
  integration-appjson:
    runs-on: ubuntu-latest
    needs:
      - test
      - build-image
    permissions:
      id-token: write
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull image
        run: docker pull ${{ needs.build-image.outputs.image }}
      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::891426818781:role/github-actions-integration-tests
          aws-region: us-east-1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
      - name: Run integration test
        env:
          IMAGE: ${{ needs.build-image.outputs.image }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          DOCKER_REPO: 891426818781.dkr.ecr.us-east-1.amazonaws.com/github-integration-test
          ARTIFACT_BUCKET: integration-test-buildartifacts
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_ACCESS_TOKEN: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}
          APPNAME: gh-integration
          BRANCH: app.json
          # A folded scalar, so the quoting in the expected command
          # survives verbatim without shell escaping.
          EXPECTED_COMMAND: >-
            bash -c 'gunicorn --access-logfile - --bind 0.0.0.0:$PORT --forwarded-allow-ips '"'"'*'"'"' app:app'
        run: .github/scripts/integration-test.sh

  # Exercises a Dockerfile build rather than a buildpack build.
  integration-docker:
    runs-on: ubuntu-latest
    needs:
      - test
      - build-image
    permissions:
      id-token: write
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull image
        run: docker pull ${{ needs.build-image.outputs.image }}
      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::891426818781:role/github-actions-integration-tests
          aws-region: us-east-1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
      - name: Run integration test
        env:
          IMAGE: ${{ needs.build-image.outputs.image }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          DOCKER_REPO: 891426818781.dkr.ecr.us-east-1.amazonaws.com/github-integration-test
          ARTIFACT_BUCKET: integration-test-buildartifacts
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_ACCESS_TOKEN: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}
          APPNAME: gh-docker-integration
          BRANCH: docker-build
          # A folded scalar, so the quoting in the expected command
          # survives verbatim without shell escaping.
          EXPECTED_COMMAND: >-
            gunicorn --access-logfile - --bind 0.0.0.0:$PORT --forwarded-allow-ips '*' app:app
        run: .github/scripts/integration-test.sh
  # Aggregate check so branch protection can require one context instead of a
  # list that drifts every time a job is added or renamed. always() is load
  # bearing: without it this job is skipped when a dependency fails, and a
  # skipped required check does not block a merge.
  gate:
    name: CI
    runs-on: ubuntu-latest
    if: always()
    needs:
      - test
      - lint
      - build-image
      - integration
      - integration-docker
      - integration-appjson
      - integration-heroku24
    steps:
      - name: Verify every job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e 'any(.[]; .result != "success")' >/dev/null; then
            echo "::error::one or more required jobs did not succeed"
            exit 1
          fi
  deploy:
    runs-on: ubuntu-latest
    # Only run this job if the current commit is tagged with a version
    if: startswith(github.ref, 'refs/tags/v')
    needs:
      - gate
    permissions:
      id-token: write
      contents: read
      packages: read
    env:
      ECR_REPO: public.ecr.aws/d9q4v8a4/apppack-build
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull and tag image
        run: |
          set -ex
          # build-image is not in this job's needs, so its output is not
          # available here. The image is the one that job pushed under this
          # run id.
          IMAGE=ghcr.io/${{ github.repository }}/builder:${{ github.run_id }}
          docker pull "$IMAGE"
          docker tag "$IMAGE" "$ECR_REPO:builder"
          docker tag "$IMAGE" "$ECR_REPO:${{ github.ref_name }}"
      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: "arn:aws:iam::101287669015:role/codebuild-image-github-actions"
          aws-region: us-east-1
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0
        with:
          registry-type: public
      - name: Push image
        run: |
          set -ex
          docker push "$ECR_REPO:builder"
          docker push "$ECR_REPO:${{ github.ref_name }}"
